name: Android APK
# Builds the Pixel Replica capture app and publishes it as a downloadable test build, so the phone
# can install updates from the release page without a computer.
on:
  push:
    paths:
      - 'apps/object-capture-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/object-capture-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace
      - name: Name the APK
        run: |
          version=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/PixelReplica-$version.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/PixelReplica.apk"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          sha256sum "$RUNNER_TEMP"/apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PixelReplica-apk
          path: ${{ runner.temp }}/apk/PixelReplica.apk
      - name: Publish phone download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Test build ${VERSION} from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. On the Pixel, tap PixelReplica.apk below and install it. See docs/pixel-phone-testing.md."
          gh release delete pixel-replica-latest --yes --cleanup-tag || true
          gh release create pixel-replica-latest "$RUNNER_TEMP/apk/PixelReplica.apk" "$RUNNER_TEMP/apk/PixelReplica-${VERSION}.apk" \
            --prerelease --target "$GITHUB_SHA" --title "Pixel Replica ${VERSION} (latest test build)" --notes "$notes"
      - name: Android lint (report only)
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            apps/object-capture-android/app/build/reports/
          if-no-files-found: ignore
