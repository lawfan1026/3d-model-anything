plugins { id 'com.android.application' }

android {
    namespace 'com.pixelreplica.capture'
    compileSdk 36
    defaultConfig {
        applicationId 'com.pixelreplica.capture'
        minSdk 29
        targetSdk 36
        versionCode 4
        versionName '0.2.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    // One shared test key, so APKs from GitHub Actions, the cloud and the laptop all update each other.
    // It is a public debug key: use a private key for anything distributed beyond your own phone.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.ar:core:1.48.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
